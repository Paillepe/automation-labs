
name: ci

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*' 
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: app

    steps:
      # Récupère le code du dépôt.
      - name: Récupération du code
        uses: actions/checkout@v7

      # Installe la version de Node.js utilisée par le projet.
      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.3

      # Installe les dépendances du projet.
      - name: Installation des dépendances
        run: npm ci

      # Vérifie la qualité du code.
      - name: Lint
        run: npm run lint

      # Exécute les tests.
      - name: Tests
        run: npm test

      # Construit l'image Docker.
      - name: Construction de l'image Docker
        run: docker build .

      # Publie le rapport JUnit.
      - name: Publication du rapport de tests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rapport-de-tests
          path: app/reports/junit.xml

  publier:
    needs: verifier
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      # Détermine le nom de l'image en minuscules.
      - name: Définition du nom de l'image
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Définition de la version et de l'étiquette
      - name: Définition de la version et des étiquettes
        id: version
        run: |
          IMAGE="${{ steps.image.outputs.image }}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="$IMAGE:$GITHUB_SHA
          $IMAGE:$VERSION"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
            TAGS="$IMAGE:$GITHUB_SHA"
          fi

          {
            echo "version=$VERSION"
            echo "tags<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Connexion à GitHub Container Registry.
      - name: Connexion
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construit et publie l'image.
      - name: Construction et publication
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
