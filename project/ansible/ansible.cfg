# Squelette fourni (lab ansible). Ansible ignore un ansible.cfg posé dans un dossier ouvert en écriture à tous :
# usine et les checks le désignent par ANSIBLE_CONFIG. Lancez vos commandes depuis project/ansible/.
[defaults]
inventory = inventory.ini
remote_user = deploy
private_key_file = ~/.ssh/usine_lab
host_key_checking = False
interpreter_python = auto_silent
# Mot de passe de Vault : celui du cours, dans infra/keys/ (un mot de passe de LAB, sans valeur ailleurs).
# Dans une vraie équipe, il vit hors du dépôt : gestionnaire de mots de passe, ou secret du pipeline.
vault_password_file = ../../infra/keys/vault-pass.txt
retry_files_enabled = False

[ssh_connection]
ssh_args = -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
