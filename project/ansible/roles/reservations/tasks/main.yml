- name: Construire l'archive de l'application
  ansible.builtin.shell: |
    set -e
    tmp_dir="$(mktemp -d)"
    trap 'rm -rf "$tmp_dir"' EXIT

    git -C "{{ repo_root }}" archive "{{ app_commit }}" app \
      | tar -x -C "$tmp_dir"

    cd "$tmp_dir/app"
    npm ci --omit=dev --no-audit --no-fund

    tar -czf "{{ build_archive }}" \
      src package.json package-lock.json node_modules
  args:
    creates: "{{ build_archive }}"
  delegate_to: localhost
  run_once: true
  become: false

# 2. Installer les prérequis
- name: Installer les outils nécessaires au service SysV
  ansible.builtin.apt:
    name:
      - init-system-helpers
      - gzip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: S'assurer que l'utilisateur applicatif existe
  ansible.builtin.user:
    name: deploy
    state: present

- name: Définir APP_USER
  ansible.builtin.lineinfile:
    path: /etc/default/reservations
    regexp: '^#?APP_USER='
    line: 'APP_USER=deploy'
    mode: '0644'
  notify: Redémarrer reservations

# 3. Livrer l'application
- name: Copier l'archive sur le serveur
  ansible.builtin.copy:
    src: "{{ build_archive }}"
    dest: "/tmp/reservations-{{ app_commit }}.tgz"
    mode: '0644'

- name: Extraire l'application dans son répertoire
  ansible.builtin.unarchive:
    src: "/tmp/reservations-{{ app_commit }}.tgz"
    dest: /opt/reservations
    remote_src: true
    owner: deploy
    group: deploy
    creates: "/opt/reservations/.ansible-deployed-{{ app_commit }}"
  notify: Redémarrer reservations

- name: Marquer le commit comme déployé
  ansible.builtin.copy:
    content: "{{ app_commit }}\n"
    dest: "/opt/reservations/.ansible-deployed-{{ app_commit }}"
    owner: deploy
    group: deploy
    mode: '0644'
    force: false

# 4. Écrire la configuration
- name: Préparer le répertoire de configuration
  ansible.builtin.file:
    path: /etc/reservations
    state: directory
    owner: root
    group: deploy
    mode: '0750'

- name: Générer le fichier de configuration
  ansible.builtin.template:
    src: reservations.env.j2
    dest: /etc/reservations/reservations.env
    owner: root
    group: deploy
    mode: '0640'
  notify: Redémarrer reservations

# 5. Redémarrer le service
- name: Exécuter les handlers en attente
  ansible.builtin.meta: flush_handlers

- name: S'assurer que le service est démarré
  ansible.builtin.service:
    name: reservations
    state: started

# 6. Vérifier le déploiement
- name: Vérifier que l'application est prête
  ansible.builtin.uri:
    url: http://localhost:8080/ready
    method: GET
    status_code: 200
  register: reservations_readiness
  retries: 10
  delay: 3
  until: readiness.status == 200
