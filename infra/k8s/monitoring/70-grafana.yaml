# Grafana, en accès anonyme (administrateur : c'est un poste de lab). Sources de données et fournisseur fournis ;
# tableaux de bord : ConfigMap grafana-dashboards (project/monitoring/dashboards/*.json), dans le dossier « Valmorin ».
# Rien n'est téléchargé au démarrage (greffons préinstallés désactivés, ni nouvelles ni mises à jour).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: usine }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: grafana } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: usine }
      annotations: { usine/config: "@config@" }
    spec:
      securityContext: { runAsUser: 472, runAsGroup: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:13.2.6
          imagePullPolicy: IfNotPresent
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
            - { name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true" }
            - { name: GF_USERS_DEFAULT_LANGUAGE, value: fr-FR }
            - { name: GF_LOG_LEVEL, value: warn }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: providers, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /etc/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: providers, configMap: { name: grafana-providers } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: monitoring, labels: { app.kubernetes.io/name: grafana } }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: grafana }
  ports: [{ name: http, port: 3000, targetPort: http, nodePort: 30300 }]
