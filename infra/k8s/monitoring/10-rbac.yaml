# Droits de lecture de Prometheus (découverte des pods, métriques du kubelet) et d'Alloy (logs des pods).
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: usine-prometheus, labels: { app.kubernetes.io/part-of: usine } }
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: usine-prometheus, labels: { app.kubernetes.io/part-of: usine } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: usine-prometheus }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: monitoring }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: alloy, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: usine-alloy, labels: { app.kubernetes.io/part-of: usine } }
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: usine-alloy, labels: { app.kubernetes.io/part-of: usine } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: usine-alloy }
subjects: [{ kind: ServiceAccount, name: alloy, namespace: monitoring }]
