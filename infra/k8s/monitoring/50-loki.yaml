# Loki, en un seul processus (infra/monitoring/loki.yaml). Logs sur le disque du pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels: { app.kubernetes.io/name: loki, app.kubernetes.io/part-of: usine }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: loki } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loki, app.kubernetes.io/part-of: usine }
      annotations: { usine/config: "@config@" }
    spec:
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: loki
          image: grafana/loki:3.6.22
          imagePullPolicy: IfNotPresent
          args: [-config.file=/etc/loki/loki.yaml]
          ports: [{ name: http, containerPort: 3100 }]
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - { name: config, configMap: { name: loki-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: loki, namespace: monitoring, labels: { app.kubernetes.io/name: loki } }
spec:
  selector: { app.kubernetes.io/name: loki }
  ports: [{ name: http, port: 3100, targetPort: http }]
