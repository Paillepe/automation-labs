# Grafana Alloy : collecte les logs des pods par l'API de Kubernetes (infra/monitoring/config.alloy).
# Un seul nœud dans le cluster : un Deployment suffit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: usine }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: alloy } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: usine }
      annotations: { usine/config: "@config@" }
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.22.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --disable-reporting
          ports: [{ name: http, containerPort: 12345 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
            - { name: data, mountPath: /var/lib/alloy }
      volumes:
        - { name: config, configMap: { name: alloy-config } }
        - { name: data, emptyDir: {} }
