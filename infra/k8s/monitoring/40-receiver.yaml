# Récepteur de notifications local : enregistre ce qu'Alertmanager lui envoie (infra/monitoring/receiver.js).
#   depuis Alertmanager : http://receiver:8080/<chemin libre> · lecture : GET http://receiver.monitoring:8080/notifications
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver
  namespace: monitoring
  labels: { app.kubernetes.io/name: receiver, app.kubernetes.io/part-of: usine }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: receiver } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: receiver, app.kubernetes.io/part-of: usine }
      annotations: { usine/config: "@config@" }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000 }
      containers:
        - name: receiver
          image: node:24.22.3-trixie-slim
          imagePullPolicy: IfNotPresent
          command: [node, /app/receiver.mjs]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
          volumeMounts:
            - { name: code, mountPath: /app }
      volumes:
        - { name: code, configMap: { name: receiver-code } }
---
apiVersion: v1
kind: Service
metadata: { name: receiver, namespace: monitoring, labels: { app.kubernetes.io/name: receiver } }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: receiver }
  ports: [{ name: http, port: 8080, targetPort: http, nodePort: 30099 }]
