# Cible « test » (lab livraison) : l'image de l'étudiant dans app-test, à côté d'une base de test db-test.
# Se pilote par « usine deploy test », qui choisit l'image (APP_TEST_IMAGE) ; jamais à la main.
# Aucune montée de fichiers (ADR-0001). Seul app-test publie un port, sur 127.0.0.1.
# Identifiants de LAB, sans valeur hors de ce cours.
name: usine-test

services:
  db-test:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    container_name: db-test
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: lab-test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations -d reservations"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [usine]

  app-test:
    image: "${APP_TEST_IMAGE:?APP_TEST_IMAGE non défini, lance usine deploy test}"
    container_name: app-test
    # L'image vient du registre de l'étudiant ; « usine deploy test » la tire avant, et la compare au registre.
    pull_policy: never
    environment:
      DB_HOST: db-test
      DB_NAME: reservations
      DB_USER: reservations
      DB_PASSWORD: lab-test-password
      LOG_LEVEL: info
    depends_on:
      db-test:
        condition: service_healthy
    ports:
      - "127.0.0.1:${USINE_TEST_PORT:-18080}:8080"
    restart: unless-stopped
    networks: [usine]

networks:
  usine:
    name: ${USINE_NETWORK:-usine}
    external: true
