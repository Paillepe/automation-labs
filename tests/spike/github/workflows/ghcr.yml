name: ghcr
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construire et publier sur GHCR avec le jeton du workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image" --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" hello
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' | tee -a "$GITHUB_STEP_SUMMARY"
